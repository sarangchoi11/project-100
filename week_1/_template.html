<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이름</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;

      font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo",
                   "Malgun Gothic", system-ui, sans-serif;

      background: #f5f5f5;   /* 배경색 ← 바꿔보세요 */
      color: #2b2b2b;        /* 글씨색 ← 바꿔보세요 */
    }

    .card {
      padding: 48px 56px;
      background: #ffffff;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.07);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      color: #6d6d6d;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>이름</h1>          <!-- ← 본인 이름으로 -->
    <p>한 줄 소개</p>      <!-- ← 본인 소개로 -->
  </div>
</body>
</html>
