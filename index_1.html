<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>명륜중앙교회 청년부</title>
  <link rel="stylesheet" href="index_1.css">
</head>

<body>
  <div class="wrap">

    <header>
      <h1>명륜중앙교회 청년부</h1>
      <span class="date">안뇽</span>
    </header>

    <!-- 이번 주 공지 -->
    <section class="notice">
      <span class="label">이번 주 공지</span>
      <h2>코딩 동아리 첫 모임</h2>
      <p>오늘부터 4주 동안 재밌게 코딩을 해봅시다!</p>
    </section>

    <!-- 카드 3개 -->
    <div class="cards">

      <div class="card">
        <h3>주보</h3>
        <p>지난 주보 모아보기</p>
      </div>

      <div class="card">
        <h3>조</h3>
        <p>조 편성과 조원 소개</p>
      </div>

      <div class="card">
        <h3>출석</h3>
        <p>모임 출석 체크</p>
        <button id="attend">출석하기</button>
      </div>

    </div>

    <footer>
      여기도 있다!
    </footer>

  </div>

  <script src="index_1.js"></script>
</body>
</html>
